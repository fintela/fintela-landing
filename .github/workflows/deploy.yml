name: Deploy

# Builds the site — bundle, prerendered HTML for every route, sitemaps, RSS
# feed, blog/docs JSON — and syncs it to S3 + CloudFront.
#
# Every AWS identifier is a repository VARIABLE, not a literal, so this public
# workflow discloses no account id, bucket name or distribution id:
#
#   Settings → Secrets and variables → Actions → Variables
#     AWS_REGION               e.g. us-east-2
#     AWS_DEPLOY_ROLE_ARN      the OIDC role this repo may assume
#     S3_BUCKET                target bucket
#     CLOUDFRONT_DISTRIBUTION  distribution to invalidate
#
# The role's trust policy must allow this repository's OIDC subject. A role scoped
# to the old monorepo will NOT work here — see CUTOVER notes in the PR that added
# this file.
#
# Forks cannot deploy: `environment: prod` gates on approval and the variables are
# not shared with forks.
#
# One workflow, every push. There used to be a second one, `publish-content.yml`,
# that handled a content-only push by syncing the `blog/` and `docs/` prefixes
# alone — a complete publish back when a post was two JSON files fetched at run
# time and nothing else in dist/ changed. Routes are prerendered now: a new post
# changes its own `blog/<slug>/index.html`, the blog index page, the home page's
# Insights band, `sitemap-blog.xml`, `sitemap.xml` and `feed.xml` — objects at
# the bucket root and under several prefixes. There is no prefix to sync alone,
# so there is one path, and it costs what a deploy always cost: a build and a
# `/*` invalidation, about three minutes. The upload itself lives in
# scripts/sync-site.sh so that deploy.sh (the local escape hatch) does exactly
# the same thing.
#
# The CloudFront side — the viewer-request router that serves the prerendered
# pages and issues the 301s, the security headers, the 404 document — is
# configured separately and by hand: infra/cloudfront/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    # Until the repository variables are set (and the OIDC role trusts this repo),
    # skip rather than fail. This keeps the very first push green and makes the
    # cutover a deliberate act: setting S3_BUCKET is what arms deployment.
    if: vars.S3_BUCKET != ''
    steps:
      # Full history: the prerender stamps each sitemap <lastmod> with the
      # file's last commit date, which a shallow checkout cannot answer.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # A malformed post or doc is skipped with a warning rather than failing the
      # build, so a silent publish-nothing is the failure mode the next step
      # exists to catch — surfacing the reason in the run log instead of leaving
      # it to be noticed on the live site. See "Why a post doesn't appear" in
      # BLOG.md.
      - name: Build
        # Optional repository variable: when set, the prerender emits the
        # <meta name="google-site-verification"> tag on every page (one of the
        # two Search Console options in infra/cloudfront/README.md). Empty is
        # fine — the tag is simply not emitted.
        env:
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
        # pipefail: the default `run` shell is `bash -e` only, and `tee` would
        # otherwise turn a failed build into a green step that syncs half a dist/.
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report skipped content
        run: |
          # No anchor: the generator prefixes every line with "[plugin ...]".
          grep -E '(blog|docs): emitted' build.log || true

          # Drafts are routine — `_template.md` is always one, so alerting on
          # them would make this warning fire on every single run and train
          # everyone to scroll past it. Only a file that was *meant* to publish
          # and didn't is worth a warning.
          if grep 'content: skipped' build.log | grep -v 'published: false (draft)' > unpublished.log; then
            echo "::group::Files that did NOT publish"
            cat unpublished.log
            echo "::endgroup::"
            echo "::warning::Content did not publish — see \"Files that did NOT publish\" in this step."
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # One pass per object class (Content-Type + Cache-Control), stale objects
      # deleted, then a single `/*` invalidation. The filter table and the
      # reasoning are in the script's header.
      - name: Sync the site and invalidate CloudFront
        run: bash scripts/sync-site.sh "${{ vars.S3_BUCKET }}" "${{ vars.CLOUDFRONT_DISTRIBUTION }}"
